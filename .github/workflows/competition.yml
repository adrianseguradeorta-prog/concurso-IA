name: NEREID competition

on:
  push:
    branches: [main, adri-dev, raquel-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run NEREID benchmark
        run: python -m judge.run_challenge --details
